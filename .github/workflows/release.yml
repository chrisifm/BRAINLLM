# Builds and packs all seven npm platforms. Every v* tag push publishes to npm with Trusted Publishing (OIDC, no token).
# Manual dispatch defaults to packing only; publish=true publishes too; the npm-publish environment accepts v* tags and main.
# artifact_run supports reviewed package reuse or native:R:D recovery with exact native-input identity.
# Reused artifacts avoid recompiling unchanged native code when recovering a publication-workflow failure.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packages (from a v* tag or main)
        type: boolean
        default: false
      artifact_run:
        description: Prior package run, or approved native:releaseRun:diagnosticRun recovery
        type: string
        default: ''

permissions:
  contents: read

jobs:
  verify-source:
    if: always() && !cancelled() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish))
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  build:
    if: inputs.artifact_run == ''
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { key: darwin-arm64, os: macos-15, target: aarch64-apple-darwin }
          - { key: darwin-x64, os: macos-15-intel, target: x86_64-apple-darwin }
          - { key: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { key: linux-arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { key: linux-x64-musl, os: ubuntu-22.04, target: x86_64-unknown-linux-musl, musl: true }
          - { key: win32-x64, os: windows-2022, target: x86_64-pc-windows-msvc, exe: .exe }
          - { key: win32-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc, exe: .exe }
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # no machine paths in the binary (dependency panic locations): the registry and the checkout get neutral prefixes
      - shell: bash
        run: RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/brainllm --remap-path-prefix=$HOME=~" cargo build --release --locked -p brain-cli --target ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir -p bins/${{ matrix.key }}
          cp target/${{ matrix.target }}/release/brain${{ matrix.exe }} bins/${{ matrix.key }}/
      - name: Smoke the actual native release binary
        id: native-smoke
        run: node npm/smoke-native.mjs bins/${{ matrix.key }}/brain${{ matrix.exe }} --diagnostic bins/${{ matrix.key }}/native-smoke-diagnostic.json
      - name: Preserve a failed Windows smoke binary and safe phase report
        if: failure() && startsWith(matrix.key, 'win32-') && steps.native-smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-brain-${{ matrix.key }}
          path: bins/${{ matrix.key }}/
          retention-days: 3
          if-no-files-found: error
      - name: Collect public Cargo and standard-library notices for this binary
        shell: bash
        run: |
          # Metadata can need workspace/development manifests not fetched by a single-package build.
          cargo fetch --locked
          rustup component add rust-docs
          node npm/cargo-notices.mjs --binary bins/${{ matrix.key }}/brain${{ matrix.exe }} --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: brain-${{ matrix.key }}
          path: bins

  recover-native:
    if: startsWith(inputs.artifact_run, 'native:')
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { key: darwin-arm64, os: macos-15, target: aarch64-apple-darwin }
          - { key: darwin-x64, os: macos-15-intel, target: x86_64-apple-darwin }
          - { key: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { key: linux-arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { key: linux-x64-musl, os: ubuntu-22.04, target: x86_64-unknown-linux-musl }
          - { key: win32-x64, os: windows-2022, target: x86_64-pc-windows-msvc, exe: .exe }
          - { key: win32-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc, exe: .exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ARTIFACT_RUN: ${{ inputs.artifact_run }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate reviewed source closure and download a digest-pinned native artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: node npm/native-recovery.mjs prepare ${{ matrix.key }}
      # Every executable is tested on its actual platform again; no Cargo build is invoked.
      - name: Repeat the complete native smoke on the recovered executable
        shell: bash
        run: node npm/smoke-native.mjs bins/${{ matrix.key }}/brain${{ matrix.exe }} --diagnostic bins/${{ matrix.key }}/native-smoke-diagnostic.json > bins/${{ matrix.key }}/native-recovery-smoke.json
      - name: Provision the exact reviewed Windows compiler copyright without rebuilding
        if: startsWith(matrix.key, 'win32-')
        run: rustup toolchain install 1.99.1 --profile minimal --target ${{ matrix.target }} --component rust-docs
      - name: Regenerate all four Windows notice sidecars from the unchanged lock and exact toolchain
        if: startsWith(matrix.key, 'win32-')
        env:
          RUSTUP_TOOLCHAIN: 1.99.1
        shell: bash
        run: |
          cargo fetch --locked
          node npm/cargo-notices.mjs --binary bins/${{ matrix.key }}/brain.exe --target ${{ matrix.target }}
      - name: Require smoke, target, binary, license and source proof before packaging
        run: node npm/native-recovery.mjs finalize ${{ matrix.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: brain-${{ matrix.key }}
          path: bins
          if-no-files-found: error

  pack:
    needs: [build, recover-native]
    if: always() && ((inputs.artifact_run == '' && needs.build.result == 'success') || (startsWith(inputs.artifact_run, 'native:') && needs.recover-native.result == 'success'))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { path: bins, pattern: brain-*, merge-multiple: true }
      - run: node npm/pack.mjs --bins bins --require-all
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: |
            npm/dist/*.tgz
            npm/dist/SHA256SUMS

  publish:
    if: always() && !cancelled() && needs['verify-source'].result == 'success' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)) && (needs.pack.result == 'success' || (inputs.artifact_run != '' && !startsWith(inputs.artifact_run, 'native:')))
    needs: [pack, verify-source]
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.published-version.outputs.version }}
    # npm trusts this repo, workflow and environment; the environment deploys only from v* tags and main (settings → Environments)
    environment: npm-publish
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      # Trusted Publishing (OIDC, no token) needs npm 11.5.1 or newer; Node 22 ships npm 10
      - run: npm install -g npm@^11.5.1 && npm --version
      - uses: actions/checkout@v4
        if: inputs.artifact_run != '' && !startsWith(inputs.artifact_run, 'native:')
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate reused release source
        if: inputs.artifact_run != '' && !startsWith(inputs.artifact_run, 'native:')
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.artifact_run }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REUSE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN" > "$RUNNER_TEMP/reuse-run.json"
          # This single manual recovery cohort passed all seven native and license gates plus require-all packing.
          # The ordinary tag-run rule remains; the approved recovery is pinned to its exact source and release tag.
          source_sha=$(node -e 'const r=require(process.argv[1]); const recovered=r.id===41113503223&&r.event==="workflow_dispatch"&&r.head_branch==="release/0.4.0-packaging"&&r.head_sha==="1be862f1bcb342973d6fb8586a076b798ae5839f"&&r.conclusion==="success"&&process.env.GITHUB_REF==="refs/tags/v0.4.0"; if(r.path!==".github/workflows/release.yml"||r.head_repository.full_name!==process.env.GITHUB_REPOSITORY||!((r.event==="push"&&/^v[0-9]/.test(r.head_branch))||recovered)||! /^[a-f0-9]{40}$/.test(r.head_sha))process.exit(1); process.stdout.write(r.head_sha)' "$RUNNER_TEMP/reuse-run.json")
          git diff --exit-code "$source_sha" "$GITHUB_SHA" -- . ':!.github/workflows/release.yml'
          echo "Reusing reviewed release packages from $source_sha; only release workflow changes are permitted."
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: pkgs
          run-id: ${{ startsWith(inputs.artifact_run, 'native:') && github.run_id || inputs.artifact_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Read the exact artifact version
        id: published-version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, appendFileSync } from 'node:fs'
          const matches = readdirSync('pkgs').map(name => /^christianirack-brainllm-((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?)\.tgz$/.exec(name)).filter(Boolean)
          if (matches.length !== 1) throw Error('Expected exactly one versioned launcher artifact')
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${matches[0][1]}\n`)
          NODE
      # platform packages first, so the launcher's optional dependencies exist when it appears
      - run: |
          for f in pkgs/christianirack-brainllm-*-*.tgz; do case "$f" in *runtime*) ;; *) npm publish "./$f" --provenance --access public ;; esac; done
          npm publish ./pkgs/christianirack-brainllm-runtime-*.tgz --provenance --access public
          npm publish ./pkgs/christianirack-brainllm-[0-9]*.tgz --provenance --access public
          npm publish ./pkgs/christianirack-create-brainllm-*.tgz --provenance --access public
          npm publish ./pkgs/christianirack-create-brainll-[0-9]*.tgz --provenance --access public


  registry-smoke:
    needs: publish
    if: always() && needs.publish.result == 'success'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # No OIDC permission, registry auth setup, token env or local binary override in this job.
      # The script owns its npmrc/cache/home and installs both exact-version public initializers.
      - name: Select the disposable Linux runner browser
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$chrome"
          wrapper="$RUNNER_TEMP/brain-public-install-chrome"
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$chrome" > "$wrapper"
          chmod 700 "$wrapper"
          printf 'PUBLIC_INSTALL_BROWSER=%s\n' "$wrapper" >> "$GITHUB_ENV"
      - name: Create an owned registry-check scratch directory
        id: scratch
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { mkdtempSync, appendFileSync } from 'node:fs'
          import { join } from 'node:path'
          // Linux browser IPC sockets need short paths; the random parent belongs only to this job.
          const root = mkdtempSync(join(process.platform === 'linux' ? '/tmp' : process.env.RUNNER_TEMP, 'br-'))
          appendFileSync(process.env.GITHUB_OUTPUT, `path=${root}\n`)
          JS
      - name: Verify anonymous published installation and real CLI journeys
        env:
          PUBLIC_VERSION: ${{ needs.publish.outputs.version }}
          TMPDIR: ${{ steps.scratch.outputs.path }}
          TMP: ${{ steps.scratch.outputs.path }}
          TEMP: ${{ steps.scratch.outputs.path }}
        shell: bash
        run: |
          args=(--version "$PUBLIC_VERSION" --timeout-ms 900000 --keep-failure-logs)
          if [[ -n "${PUBLIC_INSTALL_BROWSER:-}" ]]; then args+=(--browser "$PUBLIC_INSTALL_BROWSER"); fi
          node npm/smoke-registry.mjs "${args[@]}"
      - name: Preserve only the safe structured failure summary
        if: failure() && steps.scratch.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: registry-failure-${{ matrix.os }}
          path: ${{ steps.scratch.outputs.path }}/**/failure-summary.json
          if-no-files-found: warn
          retention-days: 3
      - name: Remove only this job's registry-check scratch directory
        if: always() && steps.scratch.outcome == 'success'
        env:
          OWNED_SCRATCH: ${{ steps.scratch.outputs.path }}
        run: node -e "require('node:fs').rmSync(process.env.OWNED_SCRATCH,{recursive:true,force:true})"
