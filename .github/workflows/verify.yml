name: verify

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup toolchain install stable --profile minimal
      - name: Ensure verification tools
        run: |
          set -euo pipefail
          missing=()
          command -v rg >/dev/null || missing+=(ripgrep)
          command -v python3 >/dev/null || missing+=(python3)
          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo apt-get install --yes "${missing[@]}"
          fi
      - name: Select the runner browser for real CDP checks
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$chrome"
          # Only this disposable CI runner uses the wrapper; local browser configuration is untouched.
          wrapper="$RUNNER_TEMP/brain-ci-chrome"
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$chrome" > "$wrapper"
          chmod 700 "$wrapper"
          printf 'BRAIN_CHROME=%s\n' "$wrapper" >> "$GITHUB_ENV"
      - run: bash scripts/verify.sh
