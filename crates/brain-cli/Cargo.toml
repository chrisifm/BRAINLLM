[package]
name = "brain-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Single `brain` binary: BRAINLLM CLI, dev server, build and MCP"

[[bin]]
name = "brain"
path = "src/main.rs"

[dependencies]
brain-lex = { path = "../brain-lex" }
brain-serve = { path = "../brain-serve" }
brain-parse = { path = "../brain-parse" }
brain-check = { path = "../brain-check" }
brain-codegen = { path = "../brain-codegen" }
brain-css = { path = "../brain-css" }
brain-mcp = { path = "../brain-mcp" }
brain-min = { path = "../brain-min" }
brain-pack = { path = "../brain-pack" }
brain-seo = { path = "../brain-seo" }
libc = "0.2.191"

brain-backend = { path = "../brain-backend" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "signal", "process", "io-util"] }

reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
