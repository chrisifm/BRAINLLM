# Reviewed optional server blocks, included from nginx's http context. No HMR/WebSocket routes.
# Existing certs are required. This preview does not install nginx/modules or enable this site.
server {
    listen 80;
    server_name example.test;
    return 308 https://example.test$request_uri;
}
server {
    listen 443 ssl;
    server_name example.test;
    ssl_certificate "/etc/certs/fullchain.pem";
    ssl_certificate_key "/etc/certs/private.key";
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    client_body_timeout 15s;
    send_timeout 15s;
    # Keep original app statuses, CSP, Vary, private responses and hashed asset cache headers.
    # gzip/Brotli are intentionally not enabled globally over authenticated responses.
    location ~ (^|/)\. { return 404; }
    location ^~ /_server/ { return 404; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5200;
        proxy_http_version 1.1;
        proxy_set_header Host example.test;
        proxy_set_header X-Forwarded-Host example.test;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 35s;
        proxy_cache off;
        proxy_next_upstream off;
    }
    location = /api {
        proxy_pass http://127.0.0.1:5200;
        proxy_http_version 1.1;
        proxy_set_header Host example.test;
        proxy_set_header X-Forwarded-Host example.test;
