    # Native rooms only. Other frontend routes retain their existing cache and HTTP policy.
    location = {{ENDPOINT}} {
        access_log off;
        if ($request_method != GET) { return 405; }
        if ($server_protocol != HTTP/1.1) { return 400; }
        if ($request_uri ~ "\\?") { return 400; }
        if ($http_content_length !~ "^(0)?$") { return 400; }
        if ($http_transfer_encoding != "") { return 400; }
        if ($http_sec_websocket_version != "13") { return 400; }
        if ($http_sec_websocket_protocol != "brain.v1") { return 400; }
        proxy_pass {{UPSTREAM}};
        proxy_http_version 1.1;
        proxy_set_header Host {{DOMAIN}};
        proxy_set_header X-Forwarded-Host {{DOMAIN}};
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Sec-WebSocket-Extensions "";
{{COOKIES}}        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 70s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
    }
