# by BRAINLLM https://chrisifm.github.io/BRAINLLM/
name: Publish static site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - name: Verify configured hosting base
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const config=JSON.parse(readFileSync('brain.json','utf8'));
          const normalize=value=>'/'+String(value??'').replace(/^\/+|\/+$/g,'')+(String(value??'').replace(/^\/+|\/+$/g,'')?'/':'');
          if(config.output!=='static'||config.staticOutput?.host!=='github-pages')throw Error('Set output:static and staticOutput.host:github-pages');
          if(normalize(config.base)!==normalize(process.env.PAGES_BASE_PATH))throw Error('brain.json base does not match the GitHub Pages site path; update base and rebuild');
          JS
      - run: npx --no-install brain check
      - name: Build all static pages
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: npx --no-install brain build --static --site "$PAGES_ORIGIN"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
