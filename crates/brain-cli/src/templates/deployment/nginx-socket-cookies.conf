# Native socket identity projection only; no refresh, OAuth or unrelated cookies.
map $http_cookie ${{PREFIX}}_session {
    default "";
    "~(?:^|;[ ]*)__Host-brain=[^;]*(?:;[^;]*)*;[ ]*__Host-brain=" "";
    "~(?:^|;[ ]*)__Host-brain=(?<{{PREFIX}}_s>[a-f0-9]{64})(?:;|$)" "__Host-brain=${{PREFIX}}_s";
}
map $http_cookie ${{PREFIX}}_access {
    default "";
    "~(?:^|;[ ]*)__Host-brain-access=[^;]*(?:;[^;]*)*;[ ]*__Host-brain-access=" "";
    "~(?:^|;[ ]*)__Host-brain-access=(?<{{PREFIX}}_a>[A-Za-z0-9._~-]{1,8192})(?:;|$)" "__Host-brain-access=${{PREFIX}}_a";
}
map "${{PREFIX}}_session|${{PREFIX}}_access" ${{PREFIX}}_cookie {
    "|" "";
    "~^\\|" "${{PREFIX}}_access";
    "~\\|$" "${{PREFIX}}_session";
    default "${{PREFIX}}_session; ${{PREFIX}}_access";
}
