[package]
autotests = false
name = "brain-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "BRAINLLM experimental resource backend: Postgres, policies and authentication"

[dependencies]
axum = { version = "0.8.9", features = ["multipart", "ws"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "fs", "process", "sync", "io-util", "time"] }
tower-http = { version = "0.7.1", features = ["cors", "limit", "request-id", "timeout", "compression-gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json", "migrate", "uuid"] }
argon2 = "0.6.0"
tower_governor = "0.8.0"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
sha2 = "0.11.1"
ring = "0.17.14"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
slug = "0.1.6"
url = "2.5.8"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
cron = "0.17.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tokio-tungstenite = "0.30.0"
futures-util = { version = "0.3.34", features = ["sink"] }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"

[[test]]
name = "integration"
path = "tests/integration.rs"
